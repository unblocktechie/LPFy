<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Primary SEO -->
		<title>LPFY | Unlock your locked liquidity</title>
		<meta
			name="description"
			content="LPFY is a DeFi lending interface for DEX liquidity-position NFTs on Ethereum Sepolia. Supply USDC to earn interest or use supported LP positions as collateral."
		/>
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
		<meta name="author" content="LPFY" />
		<meta name="application-name" content="LPFY" />
		<meta name="theme-color" content="#2563eb" />
		<meta name="color-scheme" content="light" />

		<!-- Open Graph / social previews -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:site_name" content="LPFY" />
		<meta property="og:title" content="LPFY | Unlock your locked liquidity" />
		<meta
			property="og:description"
			content="Supply USDC to earn interest or borrow against supported DEX liquidity-position NFTs on Ethereum Sepolia."
		/>
		<meta property="og:image" content="/icon-512.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta property="og:image:alt" content="LPFY logo" />

		<!-- X / Twitter -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="LPFY | Unlock your locked liquidity" />
		<meta
			name="twitter:description"
			content="Supply USDC to earn interest or borrow against supported DEX liquidity-position NFTs on Ethereum Sepolia."
		/>
		<meta name="twitter:image" content="/icon-512.png" />
		<meta name="twitter:image:alt" content="LPFY logo" />

		<!-- Icons / install metadata -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- A canonical URL and og:url should be added here once the production domain is finalized. -->

		<!-- Structured data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "LPFY",
				"applicationCategory": "FinanceApplication",
				"operatingSystem": "Web",
				"description": "LPFY is a DeFi lending interface for supported DEX liquidity-position NFTs on Ethereum Sepolia. Users can supply USDC to earn interest or use eligible LP NFTs as collateral to borrow USDC."
			}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
